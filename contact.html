<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Checklist 3: the viewport meta tag -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Bahadir Kocabas</title>
  <!-- Bootstrap first, then my styles.css, so my rules win (same as every page) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Assignment 7, checklist 3: the same nav on every page -->
  <header>
    <nav class="container">
      <a href="index.html">Home</a>
      <a href="project.html">Projects</a>
      <a href="contact.html">Contact</a>
      <button type="button" id="theme-btn" class="btn btn-outline-light btn-sm" aria-pressed="false">Dark mode</button>
    </nav>
  </header>

  <main class="container py-4">
    <h1>Contact me</h1>
    <p>Questions about my projects? Send me a message with this form.</p>

    <!-- Assignment 7, checklist 6: my own contact form.
         "required" and type="email" are checked by the browser first.
         script.js then checks my own rule (at least 20 characters).
         Every input has a <label>; for="..." matches the input's id.
         novalidate is NOT used, so the browser checks still run. -->
    <form id="contact-form" class="card card-body contact-form">
      <div class="mb-3">
        <label for="name" class="form-label">Your name</label>
        <input id="name" name="name" type="text" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Your email</label>
        <input id="email" name="email" type="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label for="message" class="form-label">Message (at least 20 characters)</label>
        <textarea id="message" name="message" rows="5" class="form-control" required aria-describedby="message-error"></textarea>
        <!-- The warning appears right next to (under) the message box.
             aria-live="polite" makes screen readers read it when it changes. -->
        <p id="message-error" class="form-msg" aria-live="polite"></p>
      </div>

      <button type="submit" class="btn btn-primary">Send</button>
      <!-- The thank-you line. It stays empty until the form is OK. -->
      <p id="thanks" class="form-msg" aria-live="polite"></p>
    </form>
  </main>

  <footer class="container">
    <p>&copy; 2026 Bahadir Kocabas</p>
  </footer>

  <!-- script.js runs dark mode and the contact form's submit listener -->
  <script src="script.js"></script>
</body>
</html>
